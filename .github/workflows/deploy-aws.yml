# Deploys the website to AWS (ECS Fargate): build the image, push it to ECR, roll the
# "website" service onto it. Run by hand: Actions → "Deploy website to AWS" → Run workflow.
#
# One-time setup, docs/AWS-MIGRATION.md in the ringpost repo:
#   secrets   AWS_DEPLOY_ROLE_ARN   an IAM role this repo may assume (GitHub OIDC)
#   variables AWS_REGION, NEXT_PUBLIC_API_URL, NEXT_PUBLIC_DASHBOARD_URL
name: Deploy website to AWS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/ringpost/website:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_RINGPOST_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_DASHBOARD_URL=${{ vars.NEXT_PUBLIC_DASHBOARD_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Roll out
        run: |
          aws ecs describe-task-definition --task-definition ringpost-website --query taskDefinition > td.json
          jq --arg img "${{ steps.ecr.outputs.registry }}/ringpost/website:${{ github.sha }}" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy) | .containerDefinitions[0].image=$img' td.json > td-new.json
          TD=$(aws ecs register-task-definition --cli-input-json file://td-new.json --query taskDefinition.taskDefinitionArn --output text)
          aws ecs update-service --cluster ringpost --service website --task-definition "$TD" >/dev/null
          aws ecs wait services-stable --cluster ringpost --services website
          echo "Deployed ${{ github.sha }}"
